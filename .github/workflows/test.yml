name: test

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke examples
        run: |
          python3 skills/qualify-before-enrich/scripts/score.py --file skills/qualify-before-enrich/examples/rows-good.json
          python3 skills/qualify-before-enrich/scripts/score.py --file skills/qualify-before-enrich/examples/rows-drop.json
          ! python3 skills/qualify-before-enrich/scripts/score.py --file skills/qualify-before-enrich/examples/rows-fail-icp.json
          ! python3 skills/qualify-before-enrich/scripts/score.py --file skills/qualify-before-enrich/examples/rows-missing-fields.json
